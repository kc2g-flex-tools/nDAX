name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ created ]

jobs:

  build:
    name: Build
    # linux/arm64 builds natively on an arm64 runner so it can use cgo for
    # the native PipeWire backend; everything else cross-compiles from amd64.
    runs-on: ${{ (matrix.os == 'linux' && matrix.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        go: ['1.23', '1.24']
        os: ['linux', 'darwin']
        arch: ['amd64', 'arm', 'arm64']
        include:
          - go: '1.24'
            release: true
        exclude:
          - os: 'darwin'
            arch: 'arm'
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
      id: go

    - name: Install PipeWire headers
      if: matrix.os == 'linux' && (matrix.arch == 'amd64' || matrix.arch == 'arm64')
      run: |
        sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Build
      run: go build -v .
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        # The native PipeWire backend needs cgo, so linux/amd64 and
        # linux/arm64 build natively on matching runners. The remaining
        # cross builds are pure Go and use the pipe backend only.
        CGO_ENABLED: ${{ (matrix.os == 'linux' && (matrix.arch == 'amd64' || matrix.arch == 'arm64')) && 1 || 0 }}

    - name: Upload to Release
      if: github.event.release.id && matrix.release
      run: |
        curl -f -sSL -X POST \
        -H "Authorization: token ${{ secrets.GITHUB_TOKEN}}" \
        -H "Content-Type: application/octet-stream" \
        --upload-file nDAX \
        "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${{github.event.release.id}}/assets?name=nDAX-${{matrix.os}}-${{matrix.arch}}"
